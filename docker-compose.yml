version: '3.8'
services:
  pos-db:
    image: postgres:16-alpine
    container_name: mote-pos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mote_pos
    ports:
      - "5437:5432"
    volumes:
      - pos-db-data:/var/lib/postgresql/data

  pos-redis:
    image: redis:7-alpine
    container_name: mote-pos-redis
    ports:
      - "6384:6379"
    volumes:
      - pos-redis-data:/data

volumes:
  pos-db-data:
  pos-redis-data:
